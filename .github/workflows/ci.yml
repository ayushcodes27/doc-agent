name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Offline Eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,.git,__pycache__

      - name: Run Pytest Test Suite
        env:
          GEMINI_API_KEY: mock_key_for_offline_ci
          OPENAI_API_KEY: mock_key_for_offline_ci
        run: |
          pytest tests/ -v

      - name: Run Offline Benchmark & Compliance Evaluation
        run: |
          python eval/run_eval.py --mode offline

